name: Offline packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: macos-15-intel
            target: macos-intel
          - runner: macos-14
            target: macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm ci
      - run: npm run prepare:python
      - run: npm run build
      - run: python scripts/package-offline.py --target ${{ matrix.target }}
      - name: Extract the actual archive and verify contents
        shell: bash
        run: |
          archive=$(find release -name '*.zip' -print -quit)
          launcher=$(python scripts/extract-offline.py "$archive" .cache/extracted)
          echo "LAUNCHER_PATH=$launcher" >> "$GITHUB_ENV"
      - run: npx playwright install chromium
      - name: Verify extracted Mac app signature
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --deep --strict --verbose=4 "$(dirname "$(dirname "$LAUNCHER_PATH")")/.."
      - run: node --test tests/launcher.test.mjs
      - run: npx playwright test -c playwright.offline.config.ts
      - run: npm run test:restart
      - name: Verify the full mission and persistence suite offline
        run: npx playwright test -c playwright.packaged.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: little-goods-${{ matrix.target }}-unsigned-test
          path: release/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: test-results/
